name: Recover npm package publication
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git tag version to publish, without the leading v
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: Confirm that this exact version is not already published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if npm view "@nicxe/semantic-release-config@$VERSION" version --userconfig /dev/null; then
            echo "Version $VERSION is already published; recovery stopped."
            exit 1
          fi
      - name: Publish the tagged package
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm pkg set version="$VERSION"
          npm publish --access public
